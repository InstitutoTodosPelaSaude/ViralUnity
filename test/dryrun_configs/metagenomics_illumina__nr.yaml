# Config for Illumina Metagenomics Dry-run — NR validation variant.
# Exercises the run_nr_validation DAG (combine viral contigs -> diamond vs nr ->
# annotate taxonomy -> LCA top-species), requiring denovo + diamond_contigs.
samples:
  META1:
    - data/reads/META1_R1.fastq.gz
    - data/reads/META1_R2.fastq.gz
  META2:
    - data/reads/META2_R1.fastq.gz
    - data/reads/META2_R2.fastq.gz

data: illumina
output: test/dryrun_output/metagenomics_illumina_nr/
threads: 2

kraken2_database: databases/kraken2/
krona_database: databases/krona/taxonomy/
taxdump: databases/taxdump/
diamond_database: databases/diamond/nr.dmnd
taxids: databases/diamond/protein2taxid.tsv

remove_human_reads: false
remove_unclassified_reads: false
host_reference: NA
deacon_index: NA

run_denovo_assembly: true
run_kraken2_reads: true
run_kraken2_contigs: true
run_diamond_reads: false
run_diamond_contigs: true

# NR validation under test
run_nr_validation: true
nr_diamond_database: databases/NCBI_nr/nr
nr_evalue: 1.0e-10
nr_max_target_seqs: 10
nr_sensitivity: fast
nr_consensus_threshold: 0.5

run_reference_assembly: false

diamond_sensitivity: sensitive
evalue: 0.001
bleed_fraction: 0.005
negative_controls: []
compute_rpkm: false
enrichment_pseudocount: 1.0
z_score_threshold: 3.0
log2_ratio_threshold: 1.0
minimum_hit_group: 4

adapters: NA
minimum_length: 50
trim_head: 0
trim_tail: 0
cut_front_mean_quality: 20
cut_tail_mean_quality: 20
cut_right_window_size: 4
cut_right_mean_quality: 20

af_threshold: 0.5
af_isnv_threshold: 0.05
run_isnv: false
