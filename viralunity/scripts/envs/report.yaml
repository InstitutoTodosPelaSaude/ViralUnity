channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas=2.0
  # Pinned to the tested majors: plotly.py 6.x ships the plotly.js v3.x that the
  # report snapshot tests assert against, and the offline/self-contained output
  # is sensitive to a major bump. jinja2 3.x is the templating API in use.
  - plotly=6
  - jinja2=3
